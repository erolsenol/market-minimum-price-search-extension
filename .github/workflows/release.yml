name: Release extension archive
on:
  release:
    types: [published]
permissions:
  contents: write
jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high
      - name: Attach unpacked-extension archive
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          cd dist
          zip -r ../market-extension.zip .
          cd ..
          sha256sum market-extension.zip > market-extension.zip.sha256
          gh release upload "$RELEASE_TAG" market-extension.zip market-extension.zip.sha256
